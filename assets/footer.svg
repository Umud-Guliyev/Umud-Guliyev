<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="260"
  viewBox="0 0 1200 260"
  role="img"
  aria-label="Umud Guliyev — Let's Build Something"
>

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111c"/>
      <stop offset="50%" stop-color="#0a1724"/>
      <stop offset="100%" stop-color="#171127"/>
    </linearGradient>

    <!-- Border -->
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16c7ff"/>
      <stop offset="45%" stop-color="#24506d"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Main accent -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16c7ff"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Text gradient -->
    <linearGradient id="textGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#bdefff"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>

    <!-- Cyan glow -->
    <radialGradient id="cyanGlow">
      <stop offset="0%" stop-color="#16c7ff" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#16c7ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Purple glow -->
    <radialGradient id="purpleGlow">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow
        dx="0"
        dy="8"
        stdDeviation="14"
        flood-color="#000000"
        flood-opacity=".35"
      />
    </filter>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect
    x="0"
    y="0"
    width="1200"
    height="260"
    rx="22"
    fill="url(#bg)"
  />


  <!-- ================================================= -->
  <!-- AMBIENT GLOWS -->
  <!-- ================================================= -->

  <circle
    cx="90"
    cy="30"
    r="170"
    fill="url(#cyanGlow)"
  >
    <animate
      attributeName="r"
      values="150;185;150"
      dur="6s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="opacity"
      values=".55;1;.55"
      dur="6s"
      repeatCount="indefinite"
    />
  </circle>


  <circle
    cx="1110"
    cy="230"
    r="190"
    fill="url(#purpleGlow)"
  >
    <animate
      attributeName="r"
      values="165;205;165"
      dur="7s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="opacity"
      values=".5;1;.5"
      dur="7s"
      repeatCount="indefinite"
    />
  </circle>


  <!-- ================================================= -->
  <!-- OUTER BORDER -->
  <!-- ================================================= -->

  <rect
    x="1.5"
    y="1.5"
    width="1197"
    height="257"
    rx="22"
    fill="none"
    stroke="url(#border)"
    stroke-width="2"
    opacity=".85"
  >
    <animate
      attributeName="opacity"
      values=".65;1;.65"
      dur="4s"
      repeatCount="indefinite"
    />
  </rect>


  <!-- ================================================= -->
  <!-- INNER BORDER -->
  <!-- ================================================= -->

  <rect
    x="10"
    y="10"
    width="1180"
    height="240"
    rx="17"
    fill="none"
    stroke="#162b3b"
    stroke-width="1"
  />


  <!-- ================================================= -->
  <!-- TOP ACCENT LINE -->
  <!-- ================================================= -->

  <rect
    x="70"
    y="25"
    width="1060"
    height="1"
    rx="1"
    fill="url(#accent)"
    opacity=".55"
  />

  <rect
    x="70"
    y="25"
    width="180"
    height="2"
    rx="1"
    fill="#16c7ff"
  >
    <animate
      attributeName="x"
      values="70;950;70"
      dur="8s"
      repeatCount="indefinite"
    />
  </rect>


  <!-- ================================================= -->
  <!-- TERMINAL PROMPT -->
  <!-- ================================================= -->

  <text
    x="600"
    y="72"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="13"
    font-weight="700"
    letter-spacing="3"
    fill="#38cfff"
  >
    umud-guliyev / footer
  </text>


  <!-- ================================================= -->
  <!-- MAIN TITLE -->
  <!-- ================================================= -->

  <text
    x="600"
    y="122"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="32"
    font-weight="800"
    fill="url(#textGradient)"
  >
    Let's build something great.
  </text>


  <!-- ================================================= -->
  <!-- SUBTITLE -->
  <!-- ================================================= -->

  <text
    x="600"
    y="151"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="14"
    fill="#8da8ba"
  >
    Full-Stack Development • AI • SaaS • Product Engineering
  </text>


  <!-- ================================================= -->
  <!-- STATUS -->
  <!-- ================================================= -->

  <circle
    cx="452"
    cy="183"
    r="4"
    fill="#22c55e"
  >
    <animate
      attributeName="opacity"
      values="1;.25;1"
      dur="2s"
      repeatCount="indefinite"
    />
  </circle>

  <text
    x="465"
    y="187"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11"
    font-weight="700"
    letter-spacing="1.5"
    fill="#72e89a"
  >
    OPEN TO BUILD
  </text>


  <!-- ================================================= -->
  <!-- DIVIDER -->
  <!-- ================================================= -->

  <line
    x1="600"
    y1="174"
    x2="600"
    y2="193"
    stroke="#294252"
    stroke-width="1"
  />


  <!-- ================================================= -->
  <!-- GITHUB -->
  <!-- ================================================= -->

  <text
    x="620"
    y="187"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11"
    font-weight="700"
    letter-spacing="1.5"
    fill="#7ddcff"
  >
    GITHUB.COM/UMUD-GULIYEV
  </text>


  <!-- ================================================= -->
  <!-- BOTTOM -->
  <!-- ================================================= -->

  <text
    x="600"
    y="225"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="10"
    font-weight="600"
    letter-spacing="2"
    fill="#536d7c"
  >
    BUILDING PRODUCTS • SOLVING REAL PROBLEMS • KEEP SHIPPING
  </text>


  <!-- ================================================= -->
  <!-- DECORATIVE DOTS -->
  <!-- ================================================= -->

  <circle
    cx="42"
    cy="218"
    r="2"
    fill="#16c7ff"
  >
    <animate
      attributeName="opacity"
      values=".2;1;.2"
      dur="2.5s"
      repeatCount="indefinite"
    />
  </circle>

  <circle
    cx="1158"
    cy="42"
    r="2"
    fill="#8b5cf6"
  >
    <animate
      attributeName="opacity"
      values=".2;1;.2"
      dur="3s"
      repeatCount="indefinite"
    />
  </circle>

  <circle
    cx="1125"
    cy="218"
    r="3"
    fill="#16c7ff"
  >
    <animate
      attributeName="cy"
      values="218;211;218"
      dur="3s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="opacity"
      values=".3;1;.3"
      dur="3s"
      repeatCount="indefinite"
    />
  </circle>


  <!-- ================================================= -->
  <!-- CORNER ACCENTS -->
  <!-- ================================================= -->

  <path
    d="M32 55 V32 H55"
    fill="none"
    stroke="#16c7ff"
    stroke-width="2"
    opacity=".8"
  />

  <path
    d="M1145 228 H1168 V205"
    fill="none"
    stroke="#8b5cf6"
    stroke-width="2"
    opacity=".8"
  />

</svg>
