  <defs>

    <!-- ================================================= -->
    <!-- BACKGROUND -->
    <!-- ================================================= -->

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111C"/>
      <stop offset="50%" stop-color="#0A1520"/>
      <stop offset="100%" stop-color="#171127"/>
    </linearGradient>

    <!-- ================================================= -->
    <!-- ACCENTS -->
    <!-- ================================================= -->

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16C7FF"/>
      <stop offset="55%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>

    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>

    <!-- ================================================= -->
    <!-- CARD -->
    <!-- ================================================= -->

    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1926"/>
      <stop offset="100%" stop-color="#08131D"/>
    </linearGradient>

    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15506A"/>
      <stop offset="50%" stop-color="#1A3447"/>
      <stop offset="100%" stop-color="#50386F"/>
    </linearGradient>

    <!-- ================================================= -->
    <!-- GLOWS -->
    <!-- ================================================= -->

    <radialGradient id="cyanGlow">
      <stop offset="0%" stop-color="#16C7FF" stop-opacity=".13"/>
      <stop offset="100%" stop-color="#16C7FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleGlow">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

  </defs>


