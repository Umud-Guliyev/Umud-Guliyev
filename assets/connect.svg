<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="380"
  viewBox="0 0 1200 380"
  role="img"
  aria-label="Umud Guliyev — Connect and Socials"
>

  <defs>

    <!-- ================================================= -->
    <!-- BACKGROUND — HERO REFERENCE -->
    <!-- ================================================= -->

    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071522"/>
      <stop offset="52%" stop-color="#0B1B2B"/>
      <stop offset="100%" stop-color="#211337"/>
    </linearGradient>

    <!-- ================================================= -->
    <!-- CYAN / PURPLE ACCENT -->
    <!-- ================================================= -->

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16C7FF"/>
      <stop offset="52%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- ================================================= -->
    <!-- NAME / TEXT -->
    <!-- ================================================= -->

    <linearGradient id="nameGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22C7FF"/>
      <stop offset="100%" stop-color="#63C8FF"/>
    </linearGradient>

    <!-- ================================================= -->
    <!-- GLOWS -->
    <!-- ================================================= -->

    <radialGradient id="purpleGlow">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanGlow">
      <stop offset="0%" stop-color="#00C8FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00C8FF" stop-opacity="0"/>
    </radialGradient>

    <!-- ================================================= -->
    <!-- CARD -->
    <!-- ================================================= -->

    <linearGradient id="cardBackground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1B2B" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#081522" stop-opacity="0.96"/>
    </linearGradient>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect
    x="0"
    y="0"
    width="1200"
    height="380"
    rx="18"
    fill="url(#background)"
  />


  <!-- ================================================= -->
  <!-- AMBIENT GLOW -->
  <!-- ================================================= -->

  <circle
    cx="1080"
    cy="85"
    r="175"
    fill="url(#purpleGlow)"
  >

    <animate
      attributeName="r"
      values="150;185;150"
      dur="6s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="opacity"
      values="0.6;1;0.6"
      dur="6s"
      repeatCount="indefinite"
    />

  </circle>


  <circle
    cx="100"
    cy="320"
    r="145"
    fill="url(#cyanGlow)"
  >

    <animate
      attributeName="r"
      values="120;155;120"
      dur="5s"
      repeatCount="indefinite"
    />

  </circle>


  <!-- ================================================= -->
  <!-- FLOATING PARTICLES -->
  <!-- ================================================= -->

  <circle
    cx="610"
    cy="42"
    r="4"
    fill="#19C8FF"
  >

    <animateMotion
      dur="5s"
      repeatCount="indefinite"
      path="M0,0 C-90,-35 -210,-15 -360,25"
    />

  </circle>


  <circle
    cx="1090"
    cy="55"
    r="5"
    fill="#19C8FF"
  >

    <animate
      attributeName="cy"
      values="55;42;55"
      dur="3s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="opacity"
      values="0.3;1;0.3"
      dur="3s"
      repeatCount="indefinite"
    />

  </circle>


  <circle
    cx="1130"
    cy="285"
    r="3"
    fill="#9B5CFF"
  >

    <animate
      attributeName="cy"
      values="285;270;285"
      dur="4s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="opacity"
      values="0.2;0.8;0.2"
      dur="4s"
      repeatCount="indefinite"
    />

  </circle>


  <!-- ================================================= -->
  <!-- TERMINAL -->
  <!-- ================================================= -->

  <text
    x="55"
    y="42"
    font-family="Arial, Helvetica, sans-serif"
    font-size="13"
    font-weight="600"
