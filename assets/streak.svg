      attributeName="opacity"
      values=".25;1;.25"
      dur="2s"
      repeatCount="indefinite"
    />
  </circle>


  <!-- ================================================= -->
  <!-- ACTIVITY GRAPH -->
  <!-- ================================================= -->

  <rect
    x="55"
    y="380"
    width="1090"
    height="155"
    rx="14"
    fill="url(#card)"
    stroke="url(#border)"
    stroke-width="1"
  />

  <text
    x="82"
    y="414"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11"
    font-weight="700"
    letter-spacing="2"
    fill="#38CFFF"
