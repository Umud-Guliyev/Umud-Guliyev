    font-size="11"
    font-weight="600"
    fill="#60788A"
  >
    umud-guliyev / contribution
  </text>

  <!-- floating particles -->

  <circle
    cx="1080"
    cy="170"
    r="3"
    fill="#19C8FF"
  >
    <animate
      attributeName="cy"
      values="170;157;170"
      dur="3s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="opacity"
      values=".2;1;.2"
      dur="3s"
      repeatCount="indefinite"
    />
  </circle>

  <circle
    cx="1110"
    cy="365"
    r="3"
    fill="#9B5CFF"
