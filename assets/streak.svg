    weekly development intensity
  </text>


  <!-- ================================================= -->
  <!-- GRAPH BASE -->
  <!-- ================================================= -->

  <line
    x1="82"
    y1="500"
    x2="1115"
    y2="500"
    stroke="#16303F"
    stroke-width="1"
  />

  <line
    x1="82"
    y1="475"
    x2="1115"
    y2="475"
    stroke="#102632"
    stroke-width="1"
  />

  <line
    x1="82"
    y1="450"
    x2="1115"
    y2="450"
    stroke="#102632"
    stroke-width="1"
  />


  <!-- ================================================= -->
  <!-- GRAPH -->
  <!-- ================================================= -->

  <polyline
    points="
      82,491
      125,478
      168,486
      211,460
      254,472
      297,446
      340,455
      383,438
      426,450
      469,425
      512,438
      555,417
      598,429
      641,405
      684,418
      727,396
      770,410
      813,390
      856,403
      899,383
      942,397
      985,374
      1028,388
      1071,365
      1115,378
    "
    fill="none"
    stroke="url(#accent)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <animate
      attributeName="opacity"
      values=".55;1;.55"
      dur="4s"
      repeatCount="indefinite"
    />
  </polyline>


  <!-- ================================================= -->
  <!-- GRAPH DOTS -->
  <!-- ================================================= -->

  <g fill="#38CFFF">

    <circle cx="82" cy="491" r="3"/>
    <circle cx="211" cy="460" r="3"/>
    <circle cx="340" cy="455" r="3"/>
    <circle cx="469" cy="425" r="3"/>
    <circle cx="598" cy="429" r="3"/>
    <circle cx="727" cy="396" r="3"/>
    <circle cx="856" cy="403" r="3"/>
    <circle cx="985" cy="374" r="3"/>
    <circle cx="1115" cy="378" r="3"/>

  </g>


  <!-- ================================================= -->
  <!-- GRAPH LABELS -->
  <!-- ================================================= -->

  <text
    x="82"
    y="518"
    font-family="Arial, Helvetica, sans-serif"
    font-size="9"
    fill="#536B7B"
  >
    JAN
  </text>

  <text
    x="340"
    y="518"
    font-family="Arial, Helvetica, sans-serif"
    font-size="9"
    fill="#536B7B"
  >
    MAR
  </text>

  <text
    x="598"
    y="518"
    font-family="Arial, Helvetica, sans-serif"
    font-size="9"
    fill="#536B7B"
  >
    JUN
  </text>

  <text
    x="856"
    y="518"
    font-family="Arial, Helvetica, sans-serif"
    font-size="9"
    fill="#536B7B"
  >
    SEP
  </text>

  <text
    x="1090"
    y="518"
    font-family="Arial, Helvetica, sans-serif"
    font-size="9"
    fill="#536B7B"
  >
    DEC
  </text>


  <!-- ================================================= -->
  <!-- FOOTER -->
  <!-- ================================================= -->

  <rect
    x="55"
    y="560"
    width="1090"
    height="1"
    fill="url(#accent)"
    opacity=".3"
  />

  <text
    x="55"
    y="588"
    font-family="Arial, Helvetica, sans-serif"
    font-size="12"
    font-weight="700"
