    CURRENT STREAK
  </text>

  <text
    x="82"
    y="300"
    font-family="Arial, Helvetica, sans-serif"
    font-size="56"
    font-weight="800"
    fill="#FFFFFF"
  >
    7
  </text>

  <text
    x="142"
    y="299"
    font-family="Arial, Helvetica, sans-serif"
    font-size="17"
    font-weight="700"
    fill="#7CDBFF"
  >
    DAYS
  </text>

  <!-- streak indicator -->

  <circle
    cx="337"
    cy="250"
    r="24"
    fill="#0D2632"
    stroke="#16C7FF"
    stroke-width="1"
  />

  <text
    x="337"
    y="258"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="20"
    fill="#38CFFF"
  >
    ↗
  </text>

  <text
    x="82"
    y="328"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11"
    fill="#60788A"
  >
    keeping the build moving
  </text>


  <!-- ================================================= -->
  <!-- LONGEST STREAK -->
  <!-- ================================================= -->

  <rect
    x="425"
    y="205"
    width="350"
    height="150"
    rx="14"
    fill="url(#card)"
    stroke="url(#border)"
    stroke-width="1"
  />

  <text
    x="452"
    y="237"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11"
    font-weight="700"
    letter-spacing="2"
    fill="#38CFFF"
  >
    LONGEST STREAK
  </text>

  <text
    x="452"
    y="300"
    font-family="Arial, Helvetica, sans-serif"
    font-size="56"
    font-weight="800"
    fill="#FFFFFF"
  >
    42
  </text>

  <text
    x="522"
    y="299"
    font-family="Arial, Helvetica, sans-serif"
    font-size="17"
    font-weight="700"
    fill="#A78BFA"
  >
    DAYS
  </text>

  <rect
    x="452"
    y="320"
    width="275"
    height="3"
    rx="2"
    fill="#152633"
  />

  <rect
    x="452"
    y="320"
    width="208"
    height="3"
    rx="2"
    fill="url(#purple)"
  >
    <animate
      attributeName="width"
      values="180;230;180"
      dur="4s"
      repeatCount="indefinite"
    />
  </rect>


  <!-- ================================================= -->
  <!-- CONTRIBUTIONS -->
  <!-- ================================================= -->

  <rect
    x="795"
    y="205"
    width="350"
    height="150"
    rx="14"
    fill="url(#card)"
    stroke="url(#border)"
    stroke-width="1"
  />

  <text
    x="822"
    y="237"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11"
    font-weight="700"
    letter-spacing="2"
    fill="#38CFFF"
  >
    CONTRIBUTIONS
  </text>

  <text
    x="822"
    y="300"
    font-family="Arial, Helvetica, sans-serif"
    font-size="56"
    font-weight="800"
    fill="#FFFFFF"
  >
    1,024
  </text>

  <text
    x="822"
    y="328"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11"
    fill="#60788A"
