<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="620"
  viewBox="0 0 1200 620"
  role="img"
  aria-label="Umud Guliyev — GitHub Contribution and Streak"
>

  <defs>

    <!-- ================================================= -->
    <!-- BACKGROUND -->
    <!-- ================================================= -->

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050B12"/>
      <stop offset="50%" stop-color="#091722"/>
      <stop offset="100%" stop-color="#171128"/>
    </linearGradient>

    <!-- ================================================= -->
    <!-- ACCENT -->
    <!-- ================================================= -->

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16C7FF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>

    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>

    <!-- ================================================= -->
    <!-- GLOW -->
    <!-- ================================================= -->

    <radialGradient id="cyanGlow">
      <stop offset="0%" stop-color="#16C7FF" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#16C7FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleGlow">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orangeGlow">
      <stop offset="0%" stop-color="#F97316" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>

    <!-- ================================================= -->
    <!-- CARD -->
    <!-- ================================================= -->

    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1926"/>
      <stop offset="100%" stop-color="#08131D"/>
    </linearGradient>

    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15506A"/>
      <stop offset="48%" stop-color="#1B3448"/>
      <stop offset="100%" stop-color="#543B78"/>
    </linearGradient>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect
    x="0"
    y="0"
    width="1200"
    height="620"
    rx="18"
    fill="url(#bg)"
  />

  <circle
    cx="1050"
    cy="100"
    r="210"
    fill="url(#purpleGlow)"
  >
    <animate
      attributeName="r"
      values="190;225;190"
      dur="8s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="opacity"
      values=".4;.85;.4"
      dur="8s"
      repeatCount="indefinite"
    />
  </circle>

  <circle
    cx="120"
    cy="520"
    r="190"
    fill="url(#cyanGlow)"
  >
    <animate
      attributeName="r"
      values="165;205;165"
      dur="7s"
      repeatCount="indefinite"
    />
  </circle>

  <circle
    cx="610"
    cy="330"
    r="150"
    fill="url(#orangeGlow)"
  >
    <animate
      attributeName="r"
      values="135;165;135"
      dur="9s"
      repeatCount="indefinite"
    />
  </circle>


  <!-- ================================================= -->
  <!-- TERMINAL HEADER -->
  <!-- ================================================= -->

  <text
    x="55"
    y="48"
    font-family="Arial, Helvetica, sans-serif"
    font-size="13"
    font-weight="600"
    fill="#5D7385"
  >
    umud@github:~
  </text>

  <text
    x="55"
    y="82"
    font-family="Arial, Helvetica, sans-serif"
    font-size="17"
    font-weight="700"
    fill="#29C4FF"
  >
    &gt; contribution.track
  </text>

  <rect
    x="235"
    y="66"
    width="3"
    height="20"
    rx="1"
    fill="#19C8FF"
  >
    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="1s"
      repeatCount="indefinite"
    />
  </rect>


  <!-- ================================================= -->
  <!-- TITLE -->
  <!-- ================================================= -->

  <text
    x="55"
    y="132"
    font-family="Arial, Helvetica, sans-serif"
    font-size="30"
    font-weight="800"
    letter-spacing="1"
    fill="#FFFFFF"
  >
    06 CONTRIBUTION / STREAK
  </text>

  <text
    x="55"
    y="160"
    font-family="Arial, Helvetica, sans-serif"
    font-size="14"
    font-weight="500"
    fill="#7890A2"
  >
    Consistency • contribution history • developer activity
  </text>

  <rect
    x="55"
    y="177"
    width="1090"
    height="1"
    fill="url(#accent)"
    opacity=".45"
  />


  <!-- ================================================= -->
  <!-- CURRENT STREAK -->
  <!-- ================================================= -->

  <rect
    x="55"
    y="205"
    width="350"
    height="150"
    rx="14"
    fill="url(#card)"
    stroke="url(#border)"
    stroke-width="1"
  />

  <text
    x="82"
    y="237"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11"
    font-weight="700"
    letter-spacing="2"
    fill="#38CFFF"
