<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161B22;stop-opacity:1" />
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="130" cy="130" r="55" />
    </clipPath>
  </defs>

  <!-- Arka Plan -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" stroke="#30363D" stroke-width="1"/>

  <!-- Profil Resmi -->


  <!-- Avatar Çerçevesi -->
  <circle cx="130" cy="130" r="57" fill="none" stroke="#58A6FF" stroke-width="3"/>

  <!-- İsim -->
  <text x="205" y="115" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">Umud Guliyev</text>

  <!-- Kullanıcı Adı -->
  <text x="205" y="142" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#8B949E">@Umud-Guliyev</text>

  <!-- Bio -->
  <text x="205" y="172" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#C9D1D9">Full Stack Developer | React & Node.js</text>

  <!-- Konum -->
  <text x="205" y="196" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8B949E">📍 Azerbaijan</text>

  <!-- Sağ Taraf İstatistikleri -->
  <text x="970" y="103" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#FFFFFF">12</text>
  <text x="970" y="126" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2.5" fill="#38CFFF">REPOSITORIES</text>

  <line x1="900" y1="145" x2="1040" y2="145" stroke="#1B6688" stroke-width="1" opacity="0.5"/>

  <text x="970" y="183" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800" fill="#FFFFFF">4</text>
  <text x="970" y="205" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2.5" fill="#38CFFF">TOTAL STARS</text>

  <!-- Status -->
  <circle cx="1090" cy="250" r="5" fill="#22C55E">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="1103" y="255" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#7EE787">BUILDING</text>
