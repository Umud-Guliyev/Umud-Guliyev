<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="300"
  viewBox="0 0 1200 300"
  role="img"
  aria-label="Umud Guliyev — Software Engineer"
>

  <defs>

    <!-- Background -->
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071522"/>
      <stop offset="52%" stop-color="#0B1B2B"/>
      <stop offset="100%" stop-color="#211337"/>
    </linearGradient>

    <!-- Cyan / Purple accent -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16C7FF"/>
      <stop offset="52%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Name -->
    <linearGradient id="nameGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22C7FF"/>
      <stop offset="100%" stop-color="#63C8FF"/>
    </linearGradient>

    <!-- Purple glow -->
    <radialGradient id="purpleGlow">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyan glow -->
    <radialGradient id="cyanGlow">
      <stop offset="0%" stop-color="#00C8FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00C8FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Avatar -->
    <linearGradient id="avatarGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12354A"/>
      <stop offset="100%" stop-color="#17102D"/>
    </linearGradient>

  </defs>


  <!-- ================================================== -->
  <!-- MAIN CARD -->
  <!-- ================================================== -->

  <rect
    x="8"
    y="8"
    width="1184"
    height="284"
    rx="30"
    fill="url(#background)"
    stroke="#168BC1"
    stroke-width="1.5"
  />


  <!-- ================================================== -->
  <!-- AMBIENT GLOW -->
  <!-- ================================================== -->

  <circle
    cx="1040"
    cy="145"
    r="170"
    fill="url(#purpleGlow)"
  >
    <animate
      attributeName="r"
      values="145;180;145"
      dur="6s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="opacity"
      values="0.65;1;0.65"
      dur="6s"
      repeatCount="indefinite"
    />
  </circle>


  <circle
    cx="170"
    cy="60"
    r="130"
    fill="url(#cyanGlow)"
  >
    <animate
      attributeName="r"
      values="110;145;110"
      dur="5s"
      repeatCount="indefinite"
    />
  </circle>


  <!-- ================================================== -->
  <!-- DECORATIVE ORBITS -->
  <!-- ================================================== -->

  <ellipse
    cx="420"
    cy="76"
    rx="190"
    ry="44"
    fill="none"
    stroke="#168BC1"
    stroke-width="2"
    opacity="0.35"
    transform="rotate(-8 420 76)"
  />

  <ellipse
    cx="420"
    cy="76"
    rx="140"
    ry="31"
    fill="none"
    stroke="#7C3AED"
    stroke-width="1"
    opacity="0.24"
    transform="rotate(-8 420 76)"
  />


  <!-- Animated orbit particle -->

  <circle
    cx="600"
    cy="64"
    r="4"
    fill="#19C8FF"
  >
    <animateMotion
      dur="5s"
      repeatCount="indefinite"
      path="M0,0 C-100,-40 -235,-15 -380,25"
    />
  </circle>


  <!-- ================================================== -->
  <!-- RIGHT DECORATIVE RINGS -->
  <!-- ================================================== -->

  <circle
    cx="1030"
    cy="140"
    r="70"
    fill="none"
    stroke="#168BC1"
    stroke-width="1"
    opacity="0.14"
  />

  <circle
    cx="1030"
    cy="140"
    r="100"
    fill="none"
    stroke="#168BC1"
    stroke-width="1"
    opacity="0.08"
  />

  <circle
    cx="1030"
    cy="140"
    r="130"
    fill="none"
    stroke="#7C3AED"
    stroke-width="1"
    opacity="0.05"
  />


  <!-- ================================================== -->
  <!-- FLOATING PARTICLES -->
  <!-- ================================================== -->

  <circle
    cx="1100"
    cy="72"
    r="5"
    fill="#19C8FF"
  >
    <animate
      attributeName="cy"
      values="72;58;72"
      dur="3s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="opacity"
      values="0.3;1;0.3"
      dur="3s"
      repeatCount="indefinite"
    />
  </circle>


  <circle
    cx="1125"
    cy="215"
    r="3"
    fill="#9B5CFF"
  >
    <animate
      attributeName="cy"
      values="215;202;215"
      dur="4s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="opacity"
      values="0.2;0.8;0.2"
      dur="4s"
      repeatCount="indefinite"
    />
  </circle>


  <circle
    cx="875"
    cy="58"
    r="3"
    fill="#19C8FF"
  >
    <animate
      attributeName="opacity"
      values="0.2;0.9;0.2"
      dur="2.5s"
      repeatCount="indefinite"
    />
  </circle>


  <!-- ================================================== -->
  <!-- PROFILE PLACEHOLDER -->
  <!-- ================================================== -->

  <circle
    cx="120"
    cy="145"
    r="63"
    fill="#081522"
    stroke="url(#accent)"
    stroke-width="3"
  >
    <animate
      attributeName="stroke-width"
      values="2;4;2"
      dur="3s"
      repeatCount="indefinite"
    />
  </circle>


  <circle
    cx="120"
    cy="145"
    r="57"
    fill="url(#avatarGradient)"
  />


  <!-- Inner ring -->

  <circle
    cx="120"
    cy="145"
    r="47"
    fill="none"
    stroke="#19C8FF"
    stroke-width="1"
    opacity="0.25"
  />


  <!-- Initials -->

  <text
    x="120"
    y="159"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="38"
    font-weight="800"
    fill="url(#accent)"
  >
    UG
  </text>


  <!-- ================================================== -->
  <!-- USERNAME -->
  <!-- ================================================== -->

  <text
    x="242"
    y="82"
    font-family="Arial, Helvetica, sans-serif"
    font-size="16"
    font-weight="700"
    letter-spacing="2"
    fill="#29C4FF"
  >
    @umud-guliyev
  </text>


  <!-- ================================================== -->
  <!-- NAME -->
  <!-- ================================================== -->

  <text
    x="242"
    y="140"
    font-family="Arial, Helvetica, sans-serif"
    font-size="56"
    font-weight="800"
    fill="url(#nameGradient)"
  >
    Umud Guliyev
  </text>


  <!-- ================================================== -->
  <!-- TITLE -->
  <!-- ================================================== -->

  <text
    x="242"
    y="177"
    font-family="Arial, Helvetica, sans-serif"
    font-size="18"
    fill="#62D7FF"
  >
    Software Engineer • Full-Stack &amp; AI Product Builder
  </text>


  <!-- Animated cursor -->

  <rect
    x="838"
    y="161"
    width="3"
    height="21"
    rx="1"
    fill="#19C8FF"
  >
    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="1s"
      repeatCount="indefinite"
    />
  </rect>


  <!-- ================================================== -->
  <!-- RIGHT STATS -->
  <!-- ================================================== -->

  <!-- Repository count -->

  <text
    x="1010"
    y="98"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="39"
    font-weight="800"
    fill="#FFFFFF"
  >
    12
  </text>


  <text
    x="1010"
    y="121"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="10"
    font-weight="700"
    letter-spacing="2.5"
    fill="#38CFFF"
  >
    REPOSITORIES
  </text>


  <!-- Divider -->

  <line
    x1="950"
    y1="137"
    x2="1070"
    y2="137"
    stroke="#1B6688"
    stroke-width="1"
    opacity="0.55"
  />


  <!-- Star count -->

  <text
    x="1010"
    y="177"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="39"
    font-weight="800"
    fill="#FFFFFF"
  >
    4
  </text>


  <text
    x="1010"
    y="199"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="10"
    font-weight="700"
    letter-spacing="2.5"
    fill="#38CFFF"
  >
    TOTAL STARS
  </text>


  <!-- ================================================== -->
  <!-- BUILDING STATUS -->
  <!-- ================================================== -->

  <circle
    cx="962"
    cy="246"
    r="5"
    fill="#22C55E"
  >
    <animate
      attributeName="opacity"
      values="1;0.3;1"
      dur="2s"
      repeatCount="indefinite"
    />
  </circle>


  <text
    x="975"
    y="251"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11"
    font-weight="700"
    letter-spacing="1.5"
    fill="#7EE787"
  >
    BUILDING
  </text>


  <!-- ================================================== -->
  <!-- CAPABILITY PILLS -->
  <!-- ================================================== -->

  <!-- Frontend -->

  <rect
    x="55"
    y="235"
    width="180"
    height="38"
    rx="19"
    fill="#101D2A"
    stroke="#159DD4"
    stroke-width="1.2"
  />

  <text
    x="145"
    y="259"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="15"
    font-weight="600"
    fill="#36C8FF"
  >
    Frontend
  </text>


  <!-- Backend -->

  <rect
    x="250"
    y="235"
    width="180"
    height="38"
    rx="19"
    fill="#101D2A"
    stroke="#159DD4"
    stroke-width="1.2"
  />

  <text
    x="340"
    y="259"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="15"
    font-weight="600"
    fill="#36C8FF"
  >
    Backend
  </text>


  <!-- Mobile -->

  <rect
    x="445"
    y="235"
    width="150"
    height="38"
    rx="19"
    fill="#101D2A"
    stroke="#159DD4"
    stroke-width="1.2"
  />

  <text
    x="520"
    y="259"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="15"
    font-weight="600"
    fill="#36C8FF"
  >
    Mobile
  </text>


  <!-- AI -->

  <rect
    x="610"
    y="235"
    width="180"
    height="38"
    rx="19"
    fill="#101D2A"
    stroke="#159DD4"
    stroke-width="1.2"
  />

  <text
    x="700"
    y="259"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="15"
    font-weight="600"
    fill="#36C8FF"
  >
    AI &amp; Automation
  </text>


  <!-- ================================================== -->
  <!-- BOTTOM ACCENT -->
  <!-- ================================================== -->

  <rect
    x="50"
    y="286"
    width="1100"
    height="2"
    rx="1"
    fill="url(#accent)"
    opacity="0.8"
  />

</svg>
